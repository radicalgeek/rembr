# Rembr self-hosted stack. Copy .env.example to .env and populate every
# required secret before starting it. Host ports bind loopback by default.

services:
  postgres:
    image: rembr-self-host-database:local
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile
    environment:
      POSTGRES_USER: rembr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${REMBR_DATABASE_NAME:-rembr}
    volumes:
      - rembr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [data]

  rembr-db-bootstrap:
    image: rembr-self-host-database:local
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile
    user: "999:999"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/opt/rembr-bootstrap/bootstrap-database.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${REMBR_DATABASE_NAME:-rembr}
      PGUSER: rembr
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
      DB_SHADOW_PASSWORD: ${DB_SHADOW_PASSWORD:-}
      SYSTEM_ONE_SHADOW_ROLE_LOGIN_ENABLED: ${SYSTEM_ONE_INTEGRATION_ENABLED:-false}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [data]

  rembr-mcp:
    build: ./rembr-mcp
    depends_on:
      postgres:
        condition: service_healthy
      rembr-db-bootstrap:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${REMBR_DATABASE_NAME:-rembr}
      DB_USER: rembr_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      JWT_ISSUER: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      JWT_AUDIENCE: rembr-mcp
      OAUTH_EXPECTED_ISSUER: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      OAUTH_EXPECTED_AUDIENCE: ${OAUTH_AUDIENCE:?Set OAUTH_AUDIENCE in .env}
      API_KEY_SECRET: ${API_KEY_SECRET:?Set API_KEY_SECRET in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
      METRICS_SECRET: ${METRICS_SECRET:?Set METRICS_SECRET in .env}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      TEXT_GENERATION_PROVIDER: ${TEXT_GENERATION_PROVIDER:-openai-compatible}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-}
      TEXT_GENERATION_TIMEOUT_MS: ${TEXT_GENERATION_TIMEOUT_MS:-180000}
      # Azure OpenAI provider (EMBEDDING_PROVIDER=azure and/or TEXT_GENERATION_PROVIDER=azure)
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_OPENAI_TEXT_DEPLOYMENT: ${AZURE_OPENAI_TEXT_DEPLOYMENT:-}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      ENABLE_OPTIMIZATION: "false"
      MEMORY_EVOLUTION_APPLY_ENABLED: "false"
      SYSTEM_ONE_INTEGRATION_ENABLED: ${SYSTEM_ONE_INTEGRATION_ENABLED:-false}
      SYSTEM_ONE_SHADOW_CAPTURE_ENABLED: ${SYSTEM_ONE_SHADOW_CAPTURE_ENABLED:-false}
      SYSTEM_ONE_SHADOW_TENANT_ID: ${SYSTEM_ONE_SHADOW_TENANT_ID:-}
      SYSTEM_ONE_SHADOW_PROJECT_ID: ${SYSTEM_ONE_SHADOW_PROJECT_ID:-}
      SYSTEM_ONE_SHADOW_SAMPLE_RATE: ${SYSTEM_ONE_SHADOW_SAMPLE_RATE:-1}
      SYSTEM_ONE_SHADOW_MAX_CANDIDATES_PER_MEMORY: ${SYSTEM_ONE_SHADOW_MAX_CANDIDATES_PER_MEMORY:-8}
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "${REMBR_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [app, data]

  system-one-egress-proxy:
    profiles: ["jev"]
    build: ./rembr-mcp
    command: ["node", "dist/system-one-fixed-egress-proxy.js"]
    environment:
      SYSTEM_ONE_PROXY_PORT: "3128"
      SYSTEM_ONE_PROXY_UPSTREAM: api.typesafe.ai:443
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [app]

  system-one-worker:
    profiles: ["jev"]
    build: ./rembr-mcp
    command: ["node", "dist/system-one-shadow-worker.js"]
    depends_on:
      rembr-db-bootstrap:
        condition: service_completed_successfully
      system-one-egress-proxy:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${REMBR_DATABASE_NAME:-rembr}
      DB_USER: rembr_shadow
      DB_PASSWORD: ${DB_SHADOW_PASSWORD:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      SYSTEM_ONE_INTEGRATION_ENABLED: ${SYSTEM_ONE_INTEGRATION_ENABLED:-false}
      SYSTEM_ONE_SHADOW_PROVIDER_ENABLED: "true"
      SYSTEM_ONE_SHADOW_DRY_RUN: "false"
      SYSTEM_ONE_SHADOW_TENANT_ID: ${SYSTEM_ONE_SHADOW_TENANT_ID:-}
      SYSTEM_ONE_SHADOW_PROJECT_ID: ${SYSTEM_ONE_SHADOW_PROJECT_ID:-}
      SYSTEM_ONE_SHADOW_RUN_ID: ${SYSTEM_ONE_SHADOW_RUN_ID:-}
      SYSTEM_ONE_SHADOW_MAX_REQUESTS_PER_CYCLE: ${SYSTEM_ONE_SHADOW_MAX_REQUESTS_PER_CYCLE:-1}
      SYSTEM_ONE_SHADOW_INTERVAL_MS: ${SYSTEM_ONE_SHADOW_INTERVAL_MS:-60000}
      SYSTEM_ONE_SHADOW_TIMEOUT_MS: ${SYSTEM_ONE_SHADOW_TIMEOUT_MS:-30000}
      SYSTEM_ONE_HTTPS_PROXY: http://system-one-egress-proxy:3128/
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [app, data]

  # Opt-in background maintenance (embedding backfill, relationship inference,
  # evolution). Optional job types default to off; enable explicitly per run:
  # docker compose --profile maintenance run --rm rembr-maintenance-worker
  rembr-maintenance-worker:
    profiles: ["maintenance"]
    build: ./rembr-mcp
    command: ["node", "dist/maintenance-worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      rembr-db-bootstrap:
        condition: service_completed_successfully
      rembr-mcp:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${REMBR_DATABASE_NAME:-rembr}
      DB_USER: rembr_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      TEXT_GENERATION_PROVIDER: ${TEXT_GENERATION_PROVIDER:-openai-compatible}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-}
      TEXT_GENERATION_TIMEOUT_MS: ${TEXT_GENERATION_TIMEOUT_MS:-180000}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${AZURE_OPENAI_EMBEDDING_DEPLOYMENT:-}
      AZURE_OPENAI_TEXT_DEPLOYMENT: ${AZURE_OPENAI_TEXT_DEPLOYMENT:-}
      MAINTENANCE_INTERVAL_MS: ${MAINTENANCE_INTERVAL_MS:-60000}
      MAINTENANCE_ENQUEUE_LIMIT: ${MAINTENANCE_ENQUEUE_LIMIT:-500}
      MAINTENANCE_EMBEDDING_BATCH_SIZE: ${MAINTENANCE_EMBEDDING_BATCH_SIZE:-10}
      MAINTENANCE_RELATIONSHIP_BATCH_SIZE: ${MAINTENANCE_RELATIONSHIP_BATCH_SIZE:-10}
      MAINTENANCE_CONTRADICTION_BATCH_SIZE: ${MAINTENANCE_CONTRADICTION_BATCH_SIZE:-3}
      MAINTENANCE_EVOLUTION_BATCH_SIZE: ${MAINTENANCE_EVOLUTION_BATCH_SIZE:-2}
      MAINTENANCE_CLEANUP_BATCH_SIZE: ${MAINTENANCE_CLEANUP_BATCH_SIZE:-10}
      MAINTENANCE_EVOLUTION_MIN_CONFIDENCE: ${MAINTENANCE_EVOLUTION_MIN_CONFIDENCE:-0.85}
      MEMORY_EVOLUTION_ENABLED: ${MEMORY_EVOLUTION_ENABLED:-false}
      MEMORY_EVOLUTION_ASSESSMENT_ENABLED: ${MEMORY_EVOLUTION_ASSESSMENT_ENABLED:-false}
      MEMORY_EVOLUTION_APPLY_ENABLED: ${MEMORY_EVOLUTION_APPLY_ENABLED:-false}
      MAINTENANCE_RELATIONSHIP_ENABLED: ${MAINTENANCE_RELATIONSHIP_ENABLED:-false}
      MAINTENANCE_CONTRADICTION_ENABLED: ${MAINTENANCE_CONTRADICTION_ENABLED:-false}
      MAINTENANCE_CLEANUP_ENABLED: ${MAINTENANCE_CLEANUP_ENABLED:-false}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    healthcheck:
      disable: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [app, data]

  rembr-console:
    build: ./rembr-console
    depends_on:
      rembr-mcp:
        condition: service_healthy
    environment:
      REMBR_URL: http://rembr-mcp:3000/mcp
      REMBR_API_KEY: ${REMBR_API_KEY:-}
      REMBR_CONSOLE_AUTH_TOKEN: ${REMBR_CONSOLE_AUTH_TOKEN:-}
      REMBR_CONSOLE_MODE: ${REMBR_CONSOLE_MODE:-read-only}
      # "static" (default) or "session"; session mode needs TLS in front of the console.
      REMBR_CONSOLE_AUTH_MODE: ${REMBR_CONSOLE_AUTH_MODE:-static}
      REMBR_CONSOLE_ALLOWED_ORIGINS: ${REMBR_CONSOLE_ALLOWED_ORIGINS:-}
      REMBR_CONSOLE_SESSION_IDLE_MS: ${REMBR_CONSOLE_SESSION_IDLE_MS:-1800000}
      REMBR_CONSOLE_SESSION_ABSOLUTE_MS: ${REMBR_CONSOLE_SESSION_ABSOLUTE_MS:-28800000}
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "${CONSOLE_BIND_ADDRESS:-127.0.0.1}:${CONSOLE_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [app]

  ollama:
    image: ollama/ollama@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    profiles: ["ollama"]
    volumes:
      - rembr-ollama:/root/.ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks: [app]

networks:
  app: {}
  data:
    internal: true

volumes:
  rembr-pgdata:
  rembr-ollama:
