name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0

jobs:
  mcp:
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:7d0a41464797aeb9862dfdc0bbf1526b82cfd324cdd8036df19e3545f4a9ccb8
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rembr_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d rembr_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rembr_test
    defaults:
      run:
        working-directory: rembr-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: rembr-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: node ../scripts/check-test-results.mjs test-results.xml
      - run: npm run test:integration
      - run: node ../scripts/check-test-results.mjs test-results.xml
      - run: npm audit --audit-level=moderate

  console:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: rembr-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: rembr-console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=moderate

  vscode:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: rembr-vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: rembr-vscode/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate

  integrations:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            claude-code-rembr/package-lock.json
            codex-rembr/package-lock.json
            openclaw-rembr/package-lock.json
            opencode-rembr/package-lock.json
      - name: Build, test and audit agent integrations
        run: |
          set -euo pipefail
          for component in claude-code-rembr codex-rembr openclaw-rembr opencode-rembr; do
            npm --prefix "$component" ci
            npm --prefix "$component" test
            npm --prefix "$component" run --if-present build
            npm --prefix "$component" audit --audit-level=moderate
          done

  compose:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate self-hosted Compose manifest
        env:
          POSTGRES_PASSWORD: test-only-postgres
          DB_APP_PASSWORD: test-only-app
          JWT_SECRET: test-only-jwt
          PUBLIC_URL: http://127.0.0.1:3000
          OAUTH_AUDIENCE: http://127.0.0.1:3000/mcp
          API_KEY_SECRET: test-only-api-key
          ADMIN_API_KEY: test-only-admin
          METRICS_SECRET: test-only-metrics
        run: |
          bash -n deploy/compose/bootstrap-database.sh
          docker compose config -q
          docker compose build postgres rembr-mcp rembr-console

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mcp, console, vscode, integrations, compose]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build deterministic release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          for component in rembr-mcp rembr-console rembr-vscode codex-rembr openclaw-rembr opencode-rembr; do
            npm --prefix "$component" ci --ignore-scripts
            npm --prefix "$component" run --if-present build
            npm pack "./$component" --pack-destination release
          done
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git show -s --format=%ct HEAD)" \
            -czf "release/claude-code-rembr-${GITHUB_REF_NAME}.tar.gz" \
            .claude-plugin claude-code-rembr
          (cd release && sha256sum ./* > SHA256SUMS)
      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
