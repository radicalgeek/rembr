apiVersion: batch/v1
kind: Job
metadata:
  name: generate-embeddings
  namespace: rembr
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: embeddings-generator
        image: radicalgeek/rembr-mcp:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            cd /app
            cat > /tmp/generate-embeddings.js << 'EOF'
            const { MemoryDatabase } = require('./dist/database.js');
            const { OllamaEmbeddingProvider } = require('./dist/ollama-provider.js');
            
            async function main() {
              console.log('🚀 Generating missing embeddings...\n');
              
              const database = new MemoryDatabase();
              const embeddingProvider = new OllamaEmbeddingProvider(process.env.OLLAMA_URL);
              
              const result = await database.query(`
                SELECT m.id, m.content, m.tenant_id
                FROM memories m
                LEFT JOIN memory_embeddings me ON m.id = me.memory_id
                WHERE me.memory_id IS NULL
                ORDER BY m.created_at DESC
              `);
              
              const memoriesWithoutEmbeddings = result.rows;
              console.log(`📊 Found ${memoriesWithoutEmbeddings.length} memories without embeddings\n`);
              
              let successCount = 0;
              let failCount = 0;
              
              for (let i = 0; i < memoriesWithoutEmbeddings.length; i++) {
                const memory = memoriesWithoutEmbeddings[i];
                
                if ((i + 1) % 10 === 0) {
                  console.log(`   Progress: ${i + 1}/${memoriesWithoutEmbeddings.length}...`);
                }
                
                try {
                  const embedding = await embeddingProvider.generateEmbedding(memory.content);
                  
                  await database.query(`
                    INSERT INTO memory_embeddings (memory_id, tenant_id, embedding, provider, model, created_at)
                    VALUES ($1, $2, $3, $4, $5, NOW())
                    ON CONFLICT (memory_id) DO NOTHING
                  `, [
                    memory.id,
                    memory.tenant_id,
                    `[${embedding.join(',')}]`,
                    embeddingProvider.name,
                    embeddingProvider.model
                  ]);
                  
                  successCount++;
                } catch (error) {
                  console.error(`   ❌ Failed for memory ${memory.id}:`, error.message);
                  failCount++;
                }
                
                await new Promise(resolve => setTimeout(resolve, 50));
              }
              
              console.log(`\n✅ Complete! Success: ${successCount}, Failed: ${failCount}\n`);
              process.exit(failCount > 0 ? 1 : 0);
            }
            
            main().catch(error => {
              console.error('Fatal error:', error);
              process.exit(1);
            });
            EOF
            
            node /tmp/generate-embeddings.js
        env:
        - name: DB_HOST
          value: "postgres-rembr.default.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "rembr_production"
        - name: DB_USER
          value: "rembr"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-rembr-credentials
              key: POSTGRES_PASSWORD
        - name: OLLAMA_URL
          value: "http://ollama.default.svc.cluster.local:11434"
  backoffLimit: 0
